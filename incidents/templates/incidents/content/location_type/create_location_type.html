{% extends "incidents/template/base.html" %}
{% load bootstrap4 %}

{% block content %}
    <h2>Add New Location Type</h2>
    <form action="/create_location_type/" method="post" class="form">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Location Type</label>
            <input type="text" class="form-control" value="{{ next_location_type }}" disabled>
        </div>
        
        {% bootstrap_field form.location_type %}
        
        <input type="submit" value="Submit" class="btn btn-primary">
    </form>
{% endblock %}
