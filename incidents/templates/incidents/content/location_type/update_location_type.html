{% extends "incidents/template/base.html" %}
{% load bootstrap4 %}

{% block content %}
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{% url 'index' %}">Home</a></li>
            <li class="breadcrumb-item"><a href="{% url 'location_type_detail' location_type.pk %}">{{ location_type }}</a></li>
            <li class="breadcrumb-item active" aria-current="page">Edit</li>
        </ol>
    </nav>

    <div class="card mb-4">
        <div class="card-body">
            <h1 class="card-title">Edit Location Type: {{ location_type }}</h1>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form action="{% url 'update_location_type' location_type.pk %}" method="post" class="form">
                {% csrf_token %}
                {% bootstrap_field form.location_type %}
                <button type="submit" class="btn btn-warning">Update</button>
                <a href="{% url 'location_type_detail' location_type.pk %}" class="btn btn-outline-secondary ml-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
